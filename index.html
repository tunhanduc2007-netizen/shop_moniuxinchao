<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Moniu Xin chào — Baby and Kid Shop</title>
    <meta name="description" content="Hệ thống quản lý đơn hàng bán hàng online & livestream TikTok của Moniu Xin chào — Baby and Kid Shop" />
    <meta name="theme-color" content="#FF5B65" />

    <!-- Standard Favicons -->
    <link rel="icon" href="/branding/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/branding/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/branding/favicon-16x16.png" />

    <!-- Apple Touch Icon & iOS Web Clip / Add to Home Screen -->
    <link rel="apple-touch-icon" sizes="180x180" href="/branding/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Moniu Xin chào" />

    <!-- PWA Web App Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Typography: Google Fonts Nunito (soft rounded) & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Anti-Badge Injected Remover -->
    <script>
      (function() {
        function removeNetlifyBadge() {
          var sel = [
            '#netlify-badge',
            '.netlify-badge',
            '[id*="netlify-badge"]',
            '[class*="netlify-badge"]',
            '[data-netlify-badge]',
            '#netlify-drawer',
            '.netlify-drawer',
            '[data-netlify-drawer]',
            'iframe[src*="netlify"]',
            'iframe[title*="Netlify"]',
            'a[href*="netlify.com"]',
            'a[href*="netlify.app"]'
          ];
          sel.forEach(function(s) {
            document.querySelectorAll(s).forEach(function(el) {
              var parent = el.closest('div[style*="fixed"]') || el.parentElement;
              if (parent && parent !== document.body && parent !== document.getElementById('root') && parent.querySelectorAll('*').length <= 6) {
                parent.remove();
              } else {
                el.remove();
              }
            });
          });
        }
        window.addEventListener('DOMContentLoaded', removeNetlifyBadge);
        window.addEventListener('load', removeNetlifyBadge);
        if (typeof MutationObserver !== 'undefined') {
          var obs = new MutationObserver(removeNetlifyBadge);
          obs.observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
  </head>
  <body class="bg-[#FFF8F6] text-[#3D271D] antialiased selection:bg-[#FFD147]/50 selection:text-[#3D271D]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
